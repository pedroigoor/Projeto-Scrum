name: Testes Node.js

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Testes automatizados
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Obter código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # O projeto usa apenas módulos nativos do Node.js e não precisa de npm install.
      - name: Executar testes
        run: npm test
